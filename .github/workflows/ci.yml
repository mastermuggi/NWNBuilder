name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      MONGO_TEST_CONNECTION: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test NWNBuilder.slnx -c Release

      - name: Publish Windows
        run: dotnet publish src/NWNBuilder/NWNBuilder.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/win-x64

      - name: Publish Linux
        run: dotnet publish src/NWNBuilder/NWNBuilder.csproj -c Release -r linux-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out/linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: NWNBuilder-windows
          path: out/win-x64

      - uses: actions/upload-artifact@v4
        with:
          name: NWNBuilder-linux
          path: out/linux-x64
